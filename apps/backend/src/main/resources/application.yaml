spring:
  application:
    name: ${POC_SLUG:local-dev}-backend

server:
  # Cloud Run (and the platform generally) assigns the port; it is not guaranteed to be 8081.
  port: ${PORT:8081}
  address: 0.0.0.0

# Deliberately no server.servlet.context-path: this container is a sidecar, only ever reached at
# http://localhost:<port> from the ingress container — there is no proxy prefix to strip here at
# all, but keeping routing at the root matches every other POC container and keeps /healthz simple.

poc:
  # No defaults. PocProperties rejects a missing or malformed value at startup rather than letting
  # this container come up pointed at the wrong platform — see the class comment there.
  slug: ${POC_SLUG:}
  platform-api-url: ${PLATFORM_API_URL:}
  # NOT a platform-injected variable. The deployment pipeline injects the slug, the API URL and the
  # portal origin, but no issuer — integration guide §3 names this gap and asks each POC to define
  # its own setting and have the value confirmed. Supplied as a non-secret literal in poc.yaml's
  # env block; `self-service-api` is the platform's current default, confirmed before use.
  expected-issuer: ${POC_EXPECTED_ISSUER:}
  # Signing keys are fetched from platform-api-url, so plaintext http is refused unless this is
  # explicitly turned on, and then only for a loopback host.
  allow-insecure-platform-url: ${POC_ALLOW_INSECURE_PLATFORM_URL:false}

logging:
  level:
    com.sails.poc.testbed: INFO
